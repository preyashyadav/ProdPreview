name: release-images

on:
  push:
    branches: ["main"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      COMMIT_SHA: ${{ github.sha }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: services/api
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/prod-preview-api:${{ env.COMMIT_SHA }}
            ${{ env.DOCKERHUB_USERNAME }}/prod-preview-api:latest

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: services/frontend
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/prod-preview-frontend:${{ env.COMMIT_SHA }}
            ${{ env.DOCKERHUB_USERNAME }}/prod-preview-frontend:latest

      - name: Build and push Worker
        uses: docker/build-push-action@v5
        with:
          context: services/worker
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/prod-preview-worker:${{ env.COMMIT_SHA }}
            ${{ env.DOCKERHUB_USERNAME }}/prod-preview-worker:latest
