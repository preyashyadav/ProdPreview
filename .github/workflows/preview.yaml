name: preview-images

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      IMAGE_TAG: ${{ github.event.pull_request.head.sha }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: services/api
          push: true
          tags: ${{ env.DOCKERHUB_USERNAME }}/prod-preview-api:${{ env.IMAGE_TAG }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: services/frontend
          push: true
          tags: ${{ env.DOCKERHUB_USERNAME }}/prod-preview-frontend:${{ env.IMAGE_TAG }}

      - name: Build and push Worker
        uses: docker/build-push-action@v5
        with:
          context: services/worker
          push: true
          tags: ${{ env.DOCKERHUB_USERNAME }}/prod-preview-worker:${{ env.IMAGE_TAG }}

      - name: Comment preview instructions
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            Preview environment is deploying via Argo CD.
            Namespace: `pr-${{ github.event.pull_request.number }}`
            Check service IP: `kubectl -n pr-${{ github.event.pull_request.number }} get svc`
            Expected: `frontend` service should have an EXTERNAL-IP once provisioned.
